# The site is sorted the way Diátaxis sorts documentation. The Tutorial is the one page
# that teaches, so it is the only one that walks a reader through a whole session.
# Understand explains and is written by hand, because which port is a seam cannot be
# derived. How-to holds one task per page. Reference states facts, and states them from
# the source: it is the module pages and nothing written by hand. README.md is the front
# door and links here rather than repeating any of it. docs/workflow.md documents the
# process rather than the product, so it is not a page here.
site_name: cora
# The description every built page carries. Written here now: the front door leads with
# its artwork rather than a paragraph, so there is no opening sentence to read off it.
site_description: >-
  cora is a core that runs a turn — screening, retrieval, memory, asking and
  citations — and everything it knows besides arrives as a plugin.
docs_dir: docs
use_directory_urls: true

# Snippets is here for one job: the tutorial pulls its commands out of the get-started
# how-to, so the two pages cannot drift. The front door states no paragraph for a page to
# include any more — the site states its own description above.
markdown_extensions:
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true

theme:
  name: material
  # Material otherwise fetches Roboto from fonts.googleapis.com on every page view, so a
  # site read offline loses its typeface and leaks a request per reader.
  font: false
  # Light or dark as the reader's system asks, with no toggle: a toggle is a preference to
  # store and a control to explain, and the reader has already stated this one to their OS.
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
    - media: "(prefers-color-scheme: dark)"
      scheme: slate

# `--strict` fails on a page missing from the nav but says nothing about a link into one:
# a heading that is trimmed away leaves every link to it pointing at nothing, logged at
# INFO where no gate reads it. Three of them had been dead for a commit. With `anchors`
# turned up to a warning, the strict build in `tests/guards/test_docs_site.py` is what
# catches the next one.
validation:
  links:
    anchors: warn
  # A page nobody put in the nav is logged at INFO, where no gate reads it — the same
  # silence the anchors above used to keep. Turned up, the strict build is what catches
  # the next page added and not listed.
  nav:
    omitted_files: warn

nav:
  - Home: index.md
  - Tutorial:
      - Your first session: tutorial/first-session.md
  - Understand:
      - What it is made of: big-picture.md
      - What happens when you ask: happy-path.md
      - What cora does: what-it-does.md
      - What ships with it: what-ships-with-it.md
      - How the page is built: the-page.md
      - Where your data lives: data-storage.md
      - Privacy, and what a plugin costs: privacy-and-ethics.md
  - How-to:
      - Get started: how-to/get-started.md
      - Load plugins: how-to/load-plugins.md
      - Write a plugin: how-to/write-a-plugin.md
      - Run the React shell: how-to/run-the-react-shell.md
      - Run the Telegram bot: how-to/run-the-telegram-bot.md
      - Watch a turn happen: how-to/watch-a-turn.md
  - Reference: api/

# The single `api/` entry above resolves to every module. gen-files writes one page per
# module and no index; literate-nav is what expands a directory entry into pages at all,
# and it writes no nav file — with none to read it infers the section from the generated
# files in path order, which is why `gen_reference.py` sorts them. So a module added
# later needs no edit here.
plugins:
  - search
  - gen-files:
      scripts:
        - scripts/gen_reference.py
  - literate-nav
  - mkdocstrings:
      handlers:
        python:
          # Read off the tree rather than the installed package, so the site is built
          # from what the repository holds.
          paths: [src]
          options:
            # A page has to carry the contract even where no prose does: left at its
            # default, the handler omits a member without a docstring entirely, so a
            # name that has none goes missing instead of showing as bare.
            show_if_no_docstring: true
            # Default, named because the reference is where `errors.py` reads as one
            # hierarchy rather than twenty unrelated classes.
            show_bases: true
            show_signature_annotations: true
            separate_signature: true
            show_root_heading: true
            show_symbol_type_heading: true
            # What draws `dataclass` beside a class name, which is the only signature a
            # frozen dataclass has on the page.
            show_labels: true
            members_order: source

# Build history and a mockup are in docs/ without being pages of it.
exclude_docs: |
  sprints/
  cora_mockup.html
  workflow.md

# The site is two Diátaxis quadrants: the narrative pages under Understand, written and
# kept by hand because a diagram of which port is a seam cannot be derived; and the
# reference under it, generated from source. How-to stays in README.md, the repo's front
# door, and docs/workflow.md documents the process rather than the product.
site_name: cora
site_description: A RAG chatbot grounded in your uploaded documents
docs_dir: docs
use_directory_urls: true

theme:
  name: material
  # Material otherwise fetches Roboto from fonts.googleapis.com on every page view, so a
  # site read offline loses its typeface and leaks a request per reader.
  font: false

# The diagrams are Mermaid fences in the narrative pages, drawn client-side from the
# vendored copy below rather than from a CDN.
markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - Understand:
      - The map: big-picture.md
      - A session end to end: happy-path.md
  - Reference: api/

# One entry above resolves to every module: gen-files writes a page per module plus the
# api/index.md that lists them, and literate-nav reads that index as the nav — so a module
# added later needs no edit here, and no nav file ships as a page beside the list.
plugins:
  - search
  - gen-files:
      scripts:
        - scripts/gen_reference.py
  - literate-nav:
      implicit_index: true
  - mkdocstrings:
      handlers:
        python:
          # Read off the tree rather than the installed package, so the site is built
          # from what the repository holds.
          paths: [src]

# Loaded before Material looks for a diagram, so the global already exists and Material's
# own `typeof mermaid == "undefined"` fallback — a fetch of mermaid@11 from unpkg — never
# fires. The version is in the filename because it is the one the diagrams are drawn
# against, and a silent bump is what this pins.
extra_javascript:
  - assets/mermaid-10.2.3.min.js

# Build history and a mockup are in docs/ without being pages of it.
exclude_docs: |
  sprints/
  cora_mockup.html
  workflow.md

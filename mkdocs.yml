# The site is sorted the way Diátaxis sorts documentation. The Tutorial is the one page
# that teaches, so it is the only one that walks a reader through a whole session.
# Understand explains and is written by hand, because which port is a seam cannot be
# derived. How-to holds one task per page. Reference states facts: the written pages that
# a table says better than prose, then the module pages generated from source. README.md
# is the front door and links here rather than repeating any of it. docs/workflow.md documents the
# process rather than the product, so it is not a page here.
# `tests/guards/test_docs_shape.py` holds the two boundaries that slip on their own: an
# instruction inside an explanation, and a setting the source reads and no page names.
site_name: cora
site_description: A RAG chatbot grounded in your uploaded documents
docs_dir: docs
use_directory_urls: true

theme:
  name: material
  # Material otherwise fetches Roboto from fonts.googleapis.com on every page view, so a
  # site read offline loses its typeface and leaks a request per reader.
  font: false
  # Light or dark as the reader's system asks, with no toggle: a toggle is a preference to
  # store and a control to explain, and the reader has already stated this one to their OS.
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
    - media: "(prefers-color-scheme: dark)"
      scheme: slate

# `--strict` fails on a page missing from the nav but says nothing about a link into one:
# a heading that is trimmed away leaves every link to it pointing at nothing, logged at
# INFO where no gate reads it. Three of them had been dead for a commit. With `anchors`
# turned up to a warning, the strict build in `tests/guards/test_docs_site.py` is what
# catches the next one.
validation:
  links:
    anchors: warn

nav:
  - Home: index.md
  - Tutorial:
      - Your first session: tutorial/first-session.md
  - Understand:
      - The map: big-picture.md
      - A session end to end: happy-path.md
  - How-to:
      - Write a plugin: how-to/write-a-plugin.md
      - Add a file format: how-to/add-a-file-format.md
      - Swap the technology behind a port: how-to/swap-a-port.md
      - Run the React shell: how-to/run-the-react-shell.md
      - Run the tests: how-to/run-the-tests.md
      - Watch a turn happen: how-to/watch-a-turn.md
  - Reference:
      - Configuration: reference/configuration.md
      - The ports: reference/ports.md
      - The components: reference/components.md
      - A turn, step by step: reference/a-turn.md
      - The packages: reference/packages.md
      - The HTTP surface: reference/http-api.md
      - Modules: api/

# The single `api/` entry above resolves to every module. gen-files writes a page per
# module plus the api/index.md that lists them; literate-nav is what expands a directory
# entry into pages at all, and it writes no nav file — with none to read it infers the
# section from the generated files in path order, which is the order the landing page is
# written in. So a module added later needs no edit here.
plugins:
  - search
  - gen-files:
      scripts:
        - scripts/gen_reference.py
  - literate-nav
  - mkdocstrings:
      handlers:
        python:
          # Read off the tree rather than the installed package, so the site is built
          # from what the repository holds.
          paths: [src]
          options:
            # A page has to carry the contract where no prose does yet: left at its
            # default, the handler omits a member without a docstring entirely, so most
            # of the reference would be blank until story 26 lands.
            show_if_no_docstring: true
            # Default, named because the reference is where `errors.py` reads as one
            # hierarchy rather than twenty unrelated classes.
            show_bases: true
            show_signature_annotations: true
            separate_signature: true
            show_root_heading: true
            show_symbol_type_heading: true
            # What draws `dataclass` beside a class name, which is the only signature a
            # frozen dataclass has on the page.
            show_labels: true
            members_order: source

# Build history and a mockup are in docs/ without being pages of it.
exclude_docs: |
  sprints/
  cora_mockup.html
  workflow.md

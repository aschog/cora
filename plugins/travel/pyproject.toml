[project]
name = "cora-plugin-travel"
version = "0.1.0"
description = "cora's second field: a travel companion. Instructions, a corpus and a forecast tool that reaches a live service — it is what routing routes between, and it gains a researcher and an effect in the stories after this one"
requires-python = ">=3.12"
# The one technology a plugin cora ships reaches for, and it is declared here because
# reaching outside cora is this plugin's business rather than the layer's: the
# architecture guard allows `travel` an HTTP client and allows its neighbours none.
dependencies = [
    "cora",
    "httpx>=0.28.1,<1",
]

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "cora.plugins.travel"

# A layer's import bans live in a `.ruff.toml` in the directory they govern — that is
# how ruff applies them — and ruff writes its cache beside one. Neither is something an
# installed wheel has any use for, and the cache is a developer's machine in a binary.
wheel-exclude = ["**/.ruff.toml", "**/.ruff_cache"]
source-exclude = ["**/.ruff.toml", "**/.ruff_cache"]

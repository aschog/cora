[project]
name = "cora-plugin-travel"
version = "0.1.0"
description = "cora's second field: a travel companion. Instructions and a corpus and nothing else yet — it is what routing routes between, and it gains a live-service tool, a researcher and an effect in the stories after this one"
requires-python = ">=3.12"
dependencies = [
    "cora",
]

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "cora.plugins.travel"

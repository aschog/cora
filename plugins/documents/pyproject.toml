[project]
name = "cora-plugin-documents"
version = "0.1.0"
description = "the user's documents, as behaviour: an upload read, cleaned, cut and indexed into its field, and a search tool that numbers what it finds to be cited — over the index and the text store the deployment holds"
requires-python = ">=3.12"
dependencies = [
    "cora",
    "pypdf>=6.14,<7",
]

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "cora.plugins.documents"

# A layer's import bans live in a `.ruff.toml` in the directory they govern — that is
# how ruff applies them — and ruff writes its cache beside one. Neither is something an
# installed wheel has any use for, and the cache is a developer's machine in a binary.
wheel-exclude = ["**/.ruff.toml", "**/.ruff_cache"]
source-exclude = ["**/.ruff.toml", "**/.ruff_cache"]

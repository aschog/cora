[project]
name = "cora-plugin-fitness"
version = "0.1.0"
description = "cora's reference domain plugin: a fitness coach. The package uses the contract alone — `cora.domain` and `cora.ports`, no engine, no adapter; its suite builds a real host to register against"
requires-python = ">=3.12"
dependencies = [
    "cora",
]

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "cora.plugins.fitness"

# A layer's import bans live in a `.ruff.toml` in the directory they govern — that is
# how ruff applies them — and ruff writes its cache beside one. Neither is something an
# installed wheel has any use for, and the cache is a developer's machine in a binary.
wheel-exclude = ["**/.ruff.toml", "**/.ruff_cache"]
source-exclude = ["**/.ruff.toml", "**/.ruff_cache"]

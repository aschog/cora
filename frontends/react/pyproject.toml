[project]
name = "cora-frontend-react"
version = "0.1.0"
description = "cora's React frontend: an HTTP API over the assembled app, and the page that reads it"
requires-python = ">=3.12"
dependencies = [
    "cora",
    "python-multipart>=0.0.20,<0.1",
    "starlette>=0.51",
    "uvicorn>=0.42",
]

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "cora.frontends.react"

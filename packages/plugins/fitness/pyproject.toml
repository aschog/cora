[project]
name = "cora-plugin-fitness"
version = "0.1.0"
description = "cora's reference domain plugin: a fitness coach. Needs the contract alone, neither the engine nor the adapter stack"
requires-python = ">=3.12"
dependencies = [
    "cora-api",
]

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "cora.plugins.fitness"

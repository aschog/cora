[project]
name = "cora-engine"
version = "0.1.0"
description = "cora's use cases: the agent, the knowledge base and the steps of a turn, over the ports alone"
requires-python = ">=3.12"
dependencies = [
    "cora-api",
    "jsonschema>=4.26,<5",
]

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "cora.engine"

[project]
name = "cora-adapters"
version = "0.1.0"
description = "The technologies cora's ports are bound to: Chroma, OpenRouter, LangGraph, BM25, sentence-transformers"
requires-python = ">=3.12"
dependencies = [
    "cora-api",
    "chromadb>=1.5,<2",
    "langchain-openai>=1.4.1",
    "langgraph>=1.2.10,<2",
    "pypdf>=6.14,<7",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=5.3,<6",
]

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "cora.adapters"

[project]
name = "cora-core"
version = "0.1.0"
description = "cora's domain, service layer and ports — the agent with no framework and no I/O"
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4.26,<5",
    "pypdf>=6.14,<7",
]

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "cora.core"
namespace = true

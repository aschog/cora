[project]
name = "cora-app"
version = "0.1.0"
description = "cora's composition root, configuration and entrypoints"
requires-python = ">=3.12"
dependencies = [
    "cora-api",
    "cora-core",
    "cora-adapters",
    "streamlit~=1.60.0",
]

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "cora.app"

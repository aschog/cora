[project]
name = "cora"
version = "0.1.0"
description = "cora itself: the composition root and its configuration, over the engine and the adapters. What a frontend installs"
requires-python = ">=3.12"
dependencies = [
    "cora-api",
    "cora-engine",
    "cora-adapters",
]

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "cora.app"

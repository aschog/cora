[project]
name = "docchat"
version = "0.1.0"
description = "NotebookLM-style RAG chatbot with domain plugins (reference domain: fitness coach)"
readme = "README.md"
authors = [
    { name = "Georg Wirtenberger", email = "georg.wirtenberger@icloud.com" }
]
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5,<2",
    "pypdf>=6.14,<7",
]

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-watcher>=0.6.3",
    "ruff>=0.15.22",
    "ty>=0.0.60",
]

[tool.ruff]
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers -m 'not integration and not llm'"
markers = [
    "integration: touches real infrastructure (Chroma, embedding model, Streamlit); run in CI",
    "llm: real OpenRouter round-trip; manual acceptance only, never in CI",
]

[tool.pytest-watcher]
now = true
runner_args = ["-q"]

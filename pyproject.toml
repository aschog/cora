[project]
name = "cora"
version = "0.1.0"
description = "A RAG chatbot grounded in your uploaded documents: the contract, the use cases, the technologies they bind to, and the composition root over all three"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5,<2",
    "jsonschema>=4.26,<5",
    "langchain-openai>=1.4.1",
    "langgraph>=1.2.10,<2",
    "langgraph-checkpoint-sqlite>=3.1.1,<4",
    "openai>=2.48.0",
    "pypdf>=6.14,<7",
    "sentence-transformers>=5.3,<6",
]

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

# Named rather than inferred: `cora` is a namespace no distribution owns, so this one
# claims the portions it ships and leaves `cora.plugins` and `cora.frontends` free for
# an extension to contribute.
[tool.uv.build-backend]
module-name = [
    "cora.domain",
    "cora.ports",
    "cora.engine",
    "cora.adapters",
    "cora.app",
]

# The app is the root. What sits beside it is what you may install *as well*: a domain
# plugin and a frontend, each a directory named in the plural because it expects
# siblings. `ls` is the architecture diagram.
[tool.uv.workspace]
members = ["plugins/*", "frontends/*"]

[tool.uv.sources]
cora = { workspace = true }
cora-plugin-fitness = { workspace = true }
cora-plugin-security = { workspace = true }
cora-frontend-streamlit = { workspace = true }
cora-frontend-react = { workspace = true }

[dependency-groups]
dev = [
    "cora-frontend-react",
    "cora-frontend-streamlit",
    "cora-plugin-fitness",
    "cora-plugin-security",
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-watcher>=0.6.3",
    "ruff>=0.15.22",
    "ty>=0.0.60",
]

# The members are spelled out because only the root's `src/` is guessable from a layout,
# and `tests/helpers` carries the shared fakes every suite imports by name.
[tool.ty.environment]
root = [
    "src",
    "frontends/react/src",
    "frontends/streamlit/src",
    "plugins/fitness/src",
    "plugins/security/src",
    "tests/helpers",
]

[tool.ruff]
src = [
    "src",
    "frontends/react/src",
    "frontends/streamlit/src",
    "plugins/fitness/src",
    "plugins/security/src",
    "tests/helpers",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]

[tool.pytest.ini_options]
# `tests/cora/` mirrors `src/cora/`; `acceptance/` holds the outer test per story and
# `guards/` the ones whose subject is the repository rather than the app. A plugin and a
# frontend keep theirs beside their own manifest. Only `tests/helpers/` goes on sys.path,
# and only so the shared helpers import by name — importlib mode needs no test on the
# path. Nothing in there may be named for a shipped module, or it joins that namespace
# as its first portion; the mirror is safe precisely because it is not on the path.
testpaths = ["tests", "plugins", "frontends"]
pythonpath = ["tests/helpers"]
addopts = "--strict-markers --import-mode=importlib -m 'not integration and not llm'"
markers = [
    "integration: touches real infrastructure (Chroma, embedding model, Streamlit); run in CI",
    "llm: real OpenRouter round-trip through the assembled app; manual acceptance only, never in CI",
]

[tool.pytest-watcher]
now = true
runner_args = ["-q"]

[tool.uv.workspace]
# Depth carries the meaning. A directory directly under packages/ is a distribution; a
# directory holding distributions is an extension point, named in the plural because it
# expects siblings. So the four one-of-a-kind pieces sit flat and the two extensible ones
# nest, which is also where the namespace nests: packages/frontends/streamlit ships
# cora.frontends.streamlit. The container directories carry no manifest of their own, so
# they are excluded rather than matched.
members = ["packages/*", "packages/frontends/*", "packages/plugins/*"]
exclude = ["packages/frontends", "packages/plugins"]

[tool.uv.sources]
cora-api = { workspace = true }
cora-engine = { workspace = true }
cora-adapters = { workspace = true }
cora-plugin-fitness = { workspace = true }
cora-plugin-security = { workspace = true }
cora = { workspace = true }
cora-frontend-streamlit = { workspace = true }

# A virtual root: it ships nothing. The packages under packages/ are the
# distributions, one per audience that installs it, and what each may depend on is
# written in its own manifest — which is what makes "the engine knows no framework" a fact
# of the install rather than a rule a test polices.
[dependency-groups]
dev = [
    "cora-frontend-streamlit",
    "cora-plugin-fitness",
    "cora-plugin-security",
    "pytest>=9.1.1",
    "pytest-watcher>=0.6.3",
    "ruff>=0.15.22",
    "ty>=0.0.60",
]

# Spelled out rather than inferred: with no src/ at the root there is no layout for
# ty to guess from, and `tests` carries the shared fakes every package's tests import.
[tool.ty.environment]
root = [
    "packages/api/src",
    "packages/engine/src",
    "packages/adapters/src",
    "packages/app/src",
    "packages/frontends/streamlit/src",
    "packages/plugins/fitness/src",
    "packages/plugins/security/src",
    "tests",
]

[tool.ruff]
src = [
    "packages/api/src",
    "packages/engine/src",
    "packages/adapters/src",
    "packages/app/src",
    "packages/frontends/streamlit/src",
    "packages/plugins/fitness/src",
    "packages/plugins/security/src",
    "tests",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]

[tool.pytest.ini_options]
# Each package's own tests sit beside it; tests/ keeps the shared fakes and the
# suites that cross packages. Nothing under tests/ may be named for a shipped
# module: pythonpath puts it on sys.path, and a directory called cora would join
# the cora namespace as its first portion.
testpaths = ["packages", "tests"]
pythonpath = ["tests"]
addopts = "--strict-markers --import-mode=importlib -m 'not integration and not llm'"
markers = [
    "integration: touches real infrastructure (Chroma, embedding model, Streamlit); run in CI",
    "llm: real OpenRouter round-trip through the assembled app; manual acceptance only, never in CI",
]

[tool.pytest-watcher]
now = true
runner_args = ["-q"]

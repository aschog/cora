[project]
name = "cora"
version = "0.1.0"
# The one copy of README.md's opening sentence that stays a copy: packaging metadata
# cannot read a file, and the summary is what an index shows beside the name. Edit it
# there, then here. The long description is the front door itself.
description = "cora is an agent you chat with, and everything it knows and can do arrives as a plugin"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4.26,<5",
    "langchain-openai>=1.4.1",
    "langgraph>=1.2.10,<2",
    "langgraph-checkpoint-sqlite>=3.1.1,<4",
    "openai>=2.48.0",
    "pypdf>=6.14,<7",
    "sentence-transformers>=5.3,<6",
    "sqlite-vec>=0.1.9",
]

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

# Named rather than inferred: `cora` is a namespace no distribution owns, so this one
# claims the portions it ships and leaves `cora.plugins` and `cora.frontends` free for
# an extension to contribute.
[tool.uv.build-backend]
module-name = [
    "cora.domain",
    "cora.ports",
    "cora.engine",
    "cora.adapters",
    "cora.app",
]

# The app is the root. What sits beside it is what you may install *as well*: a plugin
# and a frontend, each a directory named in the plural because it expects
# siblings. `ls` is the architecture diagram.

# A layer's import bans live in a `.ruff.toml` in the directory they govern — that is
# how ruff applies them — and ruff writes its cache beside one. Neither is something an
# installed wheel has any use for, and the cache is a developer's machine in a binary.
wheel-exclude = ["**/.ruff.toml", "**/.ruff_cache"]
source-exclude = ["**/.ruff.toml", "**/.ruff_cache"]

[tool.uv.workspace]
members = ["plugins/*", "frontends/*"]

[tool.uv.sources]
cora = { workspace = true }
cora-plugin-fitness = { workspace = true }
cora-plugin-security = { workspace = true }
cora-plugin-travel = { workspace = true }
cora-frontend-react = { workspace = true }
cora-frontend-telegram = { workspace = true }

[dependency-groups]
dev = [
    "cora-frontend-react",
    "cora-frontend-telegram",
    "cora-plugin-fitness",
    "cora-plugin-security",
    "cora-plugin-travel",
    "httpx>=0.28.1",
    "mkdocs>=1.6.1",
    "mkdocs-gen-files>=0.6.1",
    "mkdocs-literate-nav>=0.6.3",
    "mkdocs-material>=9.7.7",
    "mkdocstrings[python]>=1.0.6",
    "pylint>=4.0.7",
    "pytest>=9.1.1",
    "pytest-watcher>=0.6.3",
    "pyyaml>=6.0.3",
    "ruff>=0.15.22",
    "ty>=0.0.60",
]

# The members are spelled out because only the root's `src/` is guessable from a layout,
# and `tests/helpers` carries the shared fakes every suite imports by name.
[tool.ty.environment]
root = [
    "src",
    "scripts",
    "frontends/react/src",
    "frontends/telegram/src",
    "plugins/fitness/src",
    "plugins/security/src",
    "plugins/travel/src",
    "tests/helpers",
]

[tool.ruff]
src = [
    "src",
    "scripts",
    "frontends/react/src",
    "frontends/telegram/src",
    "plugins/fitness/src",
    "plugins/security/src",
    "plugins/travel/src",
    "tests/helpers",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
    "TID", # flake8-tidy-imports — the layer boundaries, in a `.ruff.toml` per layer
    "D",   # pydocstyle
]
# `D417` would demand that an `Args:` block name every parameter, which turns
# `query: str` into `query: The query string.` — the one restatement certain to drift out
# of sync with the annotation beside it. A section here carries what the type cannot.
ignore = ["D417"]

[tool.ruff.lint.pydocstyle]
convention = "google"

# Where a missing docstring is not a finding. The four packages the reference renders are
# the exception: `cora.domain`, `cora.ports`, `cora.engine` and `cora.app` each have a
# page per module, and an undocumented public name there is a blank space on a page
# someone opened on purpose. Everything else keeps the older rule — a docstring appears
# only if it states something the code cannot. The rest of the policy — that a private
# name carries no docstring at all, in any of these trees, that no constant, variable or
# type alias carries one either, and that none runs past twelve lines of prose — is a
# guard in `tests/guards/test_architecture.py`. pydocstyle has no rule that forbids a
# docstring, and nothing anywhere measures one.
[tool.ruff.lint.per-file-ignores]
# Every class in here implements a port, and a Protocol implementation inherits no
# docstring: the prose would have to be copy-pasted out of `ports/`. Nothing outside
# `cora` imports an adapter either, so no page renders one.
"src/cora/adapters/**" = ["D"]
# A plugin is data and a frontend is a shell over `cora.app`; neither is in the reference.
"plugins/**" = ["D"]
"frontends/**" = ["D"]
# A test name carries the behaviour, and no page renders a test.
"conftest.py" = ["D"]
"tests/**" = ["D"]
# The nav generator the docs build runs, and the readers and generators `make
# diagram` runs; each documents nothing but itself.
"scripts/**" = ["D"]

[tool.pytest.ini_options]
# `tests/cora/` mirrors `src/cora/`; `acceptance/` holds the outer test per story and
# `guards/` the ones whose subject is the repository rather than the app. A plugin and a
# frontend keep theirs beside their own manifest. Only `tests/helpers/` and `scripts/` go on
# sys.path — the shared helpers and the generators import by name, and importlib mode
# needs no test on the path. Nothing in there may be named for a shipped module, or it joins that namespace
# as its first portion; the mirror is safe precisely because it is not on the path.
testpaths = ["tests", "plugins", "frontends"]
pythonpath = ["tests/helpers", "scripts"]
addopts = "--strict-markers --import-mode=importlib -m 'not integration and not llm'"
# Starlette's TestClient warns that its httpx backend is deprecated in favour of httpx2.
# The suite is otherwise warning-free, and this one is the library's own plan for its
# next major, not anything a test can act on — silenced deliberately rather than left to
# drown the next real warning.
filterwarnings = [
    "ignore:Using .httpx. with .starlette.testclient. is deprecated:UserWarning",
]
markers = [
    "integration: touches real infrastructure (a store on disk, the embedding model, the shell's API, a docs build); run in CI",
    "llm: real OpenRouter round-trip through the assembled app; manual acceptance only, never in CI",
]

[tool.pytest-watcher]
now = true
runner_args = ["-q"]

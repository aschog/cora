[project]
name = "cora"
version = "0.1.0"
description = "NotebookLM-style RAG chatbot with domain plugins (reference domain: fitness coach)"
readme = "README.md"
authors = [
    { name = "Georg Wirtenberger", email = "georg.wirtenberger@icloud.com" }
]
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5,<2",
    "jsonschema>=4.26,<5",
    "langchain-openai>=1.4.1",
    "langgraph>=1.2.10,<2",
    "pypdf>=6.14,<7",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=5.3,<6",
    "streamlit~=1.60.0",
]

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["cora"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-watcher>=0.6.3",
    "ruff>=0.15.22",
    "ty>=0.0.60",
]

[tool.ruff]
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "--strict-markers --import-mode=importlib -m 'not integration and not llm'"
markers = [
    "integration: touches real infrastructure (Chroma, embedding model, Streamlit); run in CI",
    "llm: real OpenRouter round-trip through the assembled app; manual acceptance only, never in CI",
]

[tool.pytest-watcher]
now = true
runner_args = ["-q"]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
cora-core = { workspace = true }
cora-adapters = { workspace = true }
cora-fitness = { workspace = true }
cora-app = { workspace = true }

# A virtual root: it ships nothing. The four packages under packages/ are the
# distributions, and the layer each one may depend on is written in its own
# manifest — which is what makes "core knows no framework" a fact of the install
# rather than a rule a test polices.
[dependency-groups]
dev = [
    "cora-app",
    "cora-fitness",
    "pytest>=9.1.1",
    "pytest-watcher>=0.6.3",
    "ruff>=0.15.22",
    "ty>=0.0.60",
]

# Spelled out rather than inferred: with no src/ at the root there is no layout for
# ty to guess from, and `tests` carries the shared fakes every package's tests import.
[tool.ty.environment]
root = [
    "packages/core/src",
    "packages/adapters/src",
    "packages/fitness/src",
    "packages/app/src",
    "tests",
]

[tool.ruff]
src = [
    "packages/core/src",
    "packages/adapters/src",
    "packages/fitness/src",
    "packages/app/src",
    "tests",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]

[tool.pytest.ini_options]
# Each package's own tests sit beside it; tests/ keeps the shared fakes and the
# suites that cross packages. Nothing under tests/ may be named for a shipped
# module: pythonpath puts it on sys.path, and a directory called cora would join
# the cora namespace as its first portion.
testpaths = ["packages", "tests"]
pythonpath = ["tests"]
addopts = "--strict-markers --import-mode=importlib -m 'not integration and not llm'"
markers = [
    "integration: touches real infrastructure (Chroma, embedding model, Streamlit); run in CI",
    "llm: real OpenRouter round-trip through the assembled app; manual acceptance only, never in CI",
]

[tool.pytest-watcher]
now = true
runner_args = ["-q"]

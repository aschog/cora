# quality-gates mirrors .githooks/pre-commit: format check, lint, type check,
# unit tests — plus a wheel build, which the hook does not do and nothing else covers.
# ui-tier is the React page's own toolchain: it needs node, which is why it runs here
# rather than in the hook every commit pays for.
# integration-tier runs the tests the hook skips — they need real Chroma, a downloaded
# embedding model, Streamlit and a strict docs build, so they are too slow for every commit
# but are the only cover for the UI-to-engine wiring, for what the built wheels actually
# contain, and for the docs site.
name: CI

on: [push]

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Format check
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run ty check

      - name: Unit tests
        run: uv run pytest -q

      # The wheels are the only artefact `module-name` can be wrong about: the editable
      # install every other gate runs on never reads it, so a module a manifest forgot to
      # name passes all of them and ships as nothing. A check in its own right, not a
      # dependency of the tier below — that builds its own wheels into a tmp dir.
      - name: Build every distribution
        run: uv build --all-packages --out-dir dist

  integration-tier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      # The embedding model is a ~90 MB download; without this every run pays it.
      - name: Cache the embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-all-MiniLM-L6-v2

      # A bare -m replaces the addopts selector rather than narrowing it, which is
      # what selects the tier the default run excludes.
      - name: Integration tests
        run: uv run pytest -m integration -q

  ui-tier:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontends/react/ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontends/react/ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc -b --noEmit

      - name: UI test
        run: npm test

      # The one test that needs a browser. What the reader keeps while an answer is being
      # written is invisible to happy-dom, so this tier is the only thing that fails if
      # the patch goes back to rewriting a text node it should have appended to. Only the
      # headless shell, and cached on the lockfile that pins playwright's version.
      - name: Cache the browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontends/react/ui/package-lock.json') }}

      # `--with-deps` as well as the shell: the shared libraries otherwise come from
      # whatever `ubuntu-latest` currently ships, so an image rotating one away would fail
      # every PR on a step that has nothing to do with the diff.
      - name: Install the browser
        run: npx playwright install chromium --only-shell --with-deps

      - name: Browser tier
        run: npm run test:browser

      # The page the server serves is this build's output, and a broken asset import
      # type-checks and unit-tests clean — nothing else looks at it.
      - name: Build the page
        run: npm run build

# quality-gates mirrors .githooks/pre-commit: format check, lint, type check,
# unit tests — plus a wheel build, which the hook does not do and nothing else covers.
# integration-tier runs the tests the hook skips — they need real Chroma, a downloaded
# embedding model and Streamlit, so they are too slow for every commit but are the only
# cover for the UI-to-engine wiring and for what the built wheels actually contain.
name: CI

on: [push]

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Format check
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run ty check

      - name: Unit tests
        run: uv run pytest -q

      # The wheels are the only artefact `module-name` can be wrong about: the editable
      # install every other gate runs on never reads it, so a module a manifest forgot to
      # name passes all of them and ships as nothing. Building here is what makes the
      # integration tier's wheel checks reachable.
      - name: Build every distribution
        run: uv build --all-packages --out-dir dist

  integration-tier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      # The embedding model is a ~90 MB download; without this every run pays it.
      - name: Cache the embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-all-MiniLM-L6-v2

      # A bare -m replaces the addopts selector rather than narrowing it, which is
      # what selects the tier the default run excludes.
      - name: Integration tests
        run: uv run pytest -m integration -q

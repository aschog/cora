<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 760" width="830" height="760" role="img" aria-label="cora as ports and adapters: frontends drive the engine on the left, its eight ports bind technologies on the right, plugins arrive from below.">

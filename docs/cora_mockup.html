document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.

      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

e full four-color set. Cyan and magenta are the system's own accents;\n     this yellow completes them, muted to the same press-ink register. A\n     print treatment color, not an interface accent — body copy and chrome\n     never take it. */\n  --color-process-yellow: #edbb00;\n\n  --font-heading: \"Source Serif 4\", system-ui, sans-serif;\n  --font-heading-weight: 600;\n  --font-body: \"Source Serif 4\", system-ui, sans-serif;\n\n  --space-1: 5.0px;\n  --space-2: 10.0px;\n  --space-3: 15.0px;\n  --space-4: 20.0px;\n  --space-6: 30.0px;\n  --space-8: 40.0px;\n\n  --radius-sm: 1px;\n  --radius-md: 2px;\n  --radius-lg: 4px;\n\n  /* Elevation — derived from the ground: soft ink-tinted shadows on a\n     light theme, a hairline edge + ambient darkness on a dark one. */\n  --shadow-sm: 0 1px 2px color-mix(in srgb, #2d2b2b 14%, transparent);\n  --shadow-md: 0 3px 10px color-mix(in srgb, #2d2b2b 16%, transparent);\n  --shadow-lg: 0 12px 32px color-mix(in srgb, #2d2b2b 22%, transparent);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.halftone{position:relative;filter:grayscale(0.35) contrast(1.15);overflow:hidden}\n.halftone::after{content:\"\";position:absolute;inset:0;pointer-events:none;\n  background-image:radial-gradient(circle,rgba(0,0,0,0.22) 30%,transparent 32%);\n  background-size:3px 3px;mix-blend-mode:multiply}\n\n/* The four-color separation treatment (review round 3) — a photograph\n   printed as its misregistered process plates, after the Catalogue Three\n   grammar. Markup: a figure.cmyk holding five copies of the image — the\n   first is the layout sizer (hidden), then one per plate, each tagged\n   .sep-c/.sep-m/.sep-y/.sep-k. The plates are extracted live by the SVG\n   feColorMatrix filters in the host page (copy the defs block from\n   templates/deck/index.html — a data-URI filter reference would not\n   survive Chromium), nudged a few pixels out of register, and multiplied\n   onto the paper ground; the halftone dot screens the recombined print.\n   The plate offsets live with the deck's projection-scale CSS, since\n   misregistration is sized to the output. */\n.cmyk{position:relative;overflow:hidden;background:var(--color-bg)}\n.cmyk img:first-child{opacity:0} /* layout sizer AND the alt-bearing image — opacity\n  keeps it in the accessibility tree (visibility:hidden would drop the figure's only\n  description); fully transparent, it adds nothing to the multiply backdrop */\n.cmyk img+img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;mix-blend-mode:multiply}\n.cmyk .sep-c{filter:url(#sep-c)}\n.cmyk .sep-m{filter:url(#sep-m)}\n.cmyk .sep-y{filter:url(#sep-y)}\n.cmyk .sep-k{filter:url(#sep-k)}\n.cmyk::after{content:\"\";position:absolute;inset:0;pointer-events:none;\n  background-image:radial-gradient(circle,rgba(0,0,0,0.22) 30%,transparent 32%);\n  background-size:3px 3px;mix-blend-mode:multiply}\n\n/* The plate numeral (review rounds 3-4) — display figures set as\n   misregistered process plates, the catalog's cover grammar. Review\n   round 4 (Barron): THREE plates — C, M, Y only, no black plate — so the\n   dark core comes entirely from the C×M×Y multiply overlap (the inks\n   product to exact black), with the fringes the registration drift; and\n   the spread pulled in by half (less jumbled: one figure with plate\n   fringes rather than figures sliding apart). Markup: a .cmyk-num holding\n   a .paper span (the white of the sheet: the glyph's union, built from\n   offset text-shadow copies) and three .plate spans. The construction\n   carries its own ground (--cmyk-num-ground, defaulting to paper) painted\n   on its padding box, so the multiply plates always have their backdrop\n   even inside an isolated stacking context (entrance animations); the\n   padding bleeds wider than any plate offset and the negative margin\n   hands the layout box back. Offsets are em-scaled to the glyph. The\n   .paper span carries the text once for assistive tech; the .plate spans\n   are aria-hidden repeats. */\n.cmyk-num{--cmyk-num-ground:var(--color-bg);\n  position:relative;width:fit-content;line-height:0.9;\n  font-feature-settings:\"pnum\" 1;\n  background:var(--cmyk-num-ground);padding:0.12em;margin:-0.12em}\n.cmyk-num .paper{color:var(--color-bg); /* the white of the sheet — always paper,\n  whatever the ground: the plates read as printed on paper even when the\n  surrounding page is ink */\n  text-shadow:0.036em 0.025em 0 var(--color-bg),-0.031em -0.023em 0 var(--color-bg)}\n.cmyk-num .plate{position:absolute;inset:0.12em;mix-blend-mode:multiply;\n  text-box:trim-both cap alphabetic /* the host trims to its cap box; each\n  absolute plate must trim its own line the same way, or its glyphs sit a\n  half-leading below the paper union */}\n.cmyk-num .plate-c{color:var(--color-accent)}\n.cmyk-num .plate-m{color:var(--color-accent-2);translate:0.036em 0.025em}\n.cmyk-num .plate-y{color:var(--color-process-yellow);translate:-0.031em -0.023em}\n\n/* ══════════════════════════════════════════════════════════════════════════\n   Components — built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n.hr {\n  height: 1px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 13px; line-height: 1.2; color: var(--color-text);\n  background: transparent; border: 1px solid transparent;\n  padding: calc(var(--space-2) * 0.85) var(--space-3);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { background: var(--color-accent); color: var(--color-bg); }\n.btn-primary:hover { background: var(--color-accent-600); }\n.btn-primary:active { background: var(--color-accent-700); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 34px; height: 34px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }\n.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }\n.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: none;\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 1px solid var(--color-divider);\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid color-mix(in srgb, var(--color-text) 8%, transparent);\n}\n.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(--radius-lg);\n  background: var(--color-surface); box-shadow: var(--shadow-lg);\n}\n.dialog-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 20px;\n}\n.dialog-body { font-size: 14px; opacity: 0.85; }\n.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }\n\n<\u002Fstyle>\n<script src=\"5d81105e-f933-4a65-8fb6-93e218c6951b\"><\u002Fscript>\n<style>\n  :root {\n    --color-bg: #0a0c11;\n    --color-surface: #12161d;\n    --color-text: #e7eaee;\n    --color-divider: #232a34;\n    --color-accent: #2f81f7;\n    --color-accent-2: #e05a9c;\n    --color-neutral-100: #12161d;\n    --color-neutral-200: #1b212a;\n    --color-neutral-300: #262e39;\n    --color-neutral-400: #3a4450;\n    --color-neutral-500: #5c6672;\n    --color-neutral-600: #808a96;\n    --color-neutral-700: #a2abb6;\n    --color-neutral-800: #c6ccd4;\n    --color-neutral-900: #e7eaee;\n    --color-accent-100: #10203a;\n    --color-accent-200: #16294a;\n    --color-accent-300: #274571;\n    --color-accent-600: #58a6ff;\n    --color-accent-700: #8cc0ff;\n    --color-accent-900: #d3e5ff;\n    --shadow-sm: 0 0 0 1px #1e2530;\n    --shadow-md: 0 4px 14px rgba(0,0,0,.5), 0 0 0 1px #1e2530;\n    --shadow-lg: 0 16px 40px rgba(0,0,0,.6), 0 0 0 1px #232a34;\n  }\n  html, body { margin: 0; background: var(--color-bg); color: var(--color-text); }\n  a { color: var(--color-accent-700); text-decoration: none; }\n  a:hover { color: var(--color-accent-600); text-decoration: underline; }\n  @keyframes coraPulse { 0%,100% { opacity: .35 } 50% { opacity: 1 } }\n<\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"height:100vh;overflow:hidden;background:radial-gradient(1100px 700px at 12% -10%, #14243c 0%, rgba(20,36,60,0) 62%), radial-gradient(800px 600px at 100% 110%, #17202c 0%, rgba(23,32,44,0) 60%), var(--color-bg);color:var(--color-text);font-family:var(--font-body);font-size:15px;line-height:1.55;display:flex;flex-direction:column\">\n\n  <header style=\"flex:0 0 auto;display:flex;align-items:center;gap:var(--space-3);padding:var(--space-3) var(--space-4)\">\n    <div style=\"display:flex;align-items:center;gap:var(--space-2)\">\n      <button sc-camel-on-click=\"{{ toggleLeft }}\" title=\"Documents\" style=\"align-self:center;display:flex;align-items:center;justify-content:center;width:34px;height:34px;background:none;border:none;padding:0;border-radius:999px;color:{{ leftIconColor }};cursor:pointer\" style-hover=\"background:var(--color-neutral-200)\">\n        <svg width=\"19\" height=\"19\" sc-camel-view-box=\"0 0 20 20\" fill=\"none\" aria-hidden=\"true\">\n          <rect x=\"2.5\" y=\"3.5\" width=\"15\" height=\"13\" rx=\"2.5\" stroke=\"currentColor\" stroke-width=\"1.4\"><\u002Frect>\n          <rect x=\"3.2\" y=\"4.2\" width=\"4.6\" height=\"11.6\" rx=\"1.8\" fill=\"currentColor\" fill-opacity=\"{{ leftFill }}\"><\u002Frect>\n          <line x1=\"7.8\" y1=\"3.5\" x2=\"7.8\" y2=\"16.5\" stroke=\"currentColor\" stroke-width=\"1.4\"><\u002Fline>\n        <\u002Fsvg>\n      <\u002Fbutton>\n      <span style=\"font-family:var(--font-heading);font-weight:600;font-size:22px;letter-spacing:-.01em\">cora<\u002Fspan>\n      <span style=\"font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--color-neutral-600)\">DOCUMENT AGENT<\u002Fspan>\n    <\u002Fdiv>\n\n    <div style=\"position:relative\">\n      <button sc-camel-on-click=\"{{ togglePlugins }}\" style=\"display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.06);box-shadow:inset 0 0 0 1px rgba(255,255,255,.09);color:var(--color-text);border:none;border-radius:999px;padding:8px 16px 8px 12px;font-family:var(--font-body);font-size:14px;cursor:pointer\" style-hover=\"background:var(--color-neutral-200)\">\n        <svg width=\"17\" height=\"17\" sc-camel-view-box=\"0 0 20 20\" fill=\"none\" aria-hidden=\"true\" style=\"color:{{ accent }}\">\n          <path d=\"M7 3v3.2M13 3v3.2M4.5 6.5h11v4.2a5.5 5.5 0 0 1-11 0Z\" stroke=\"currentColor\" stroke-width=\"1.4\" stroke-linejoin=\"round\"><\u002Fpath>\n          <path d=\"M10 16.2V18\" stroke=\"currentColor\" stroke-width=\"1.4\"><\u002Fpath>\n        <\u002Fsvg>\n        <span style=\"font-weight:600;letter-spacing:.01em\">{{ pluginLabel }}<\u002Fspan>\n        <span style=\"color:var(--color-neutral-600);font-size:11px\">▾<\u002Fspan>\n      <\u002Fbutton>\n      <sc-if value=\"{{ menuOpen }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"position:absolute;top:calc(100% + 8px);left:0;z-index:20;min-width:300px;background:rgba(24,29,38,.86);backdrop-filter:blur(20px);box-shadow:inset 0 0 0 1px rgba(255,255,255,.09), var(--shadow-lg);border-radius:16px;padding:var(--space-2)\">\n          <div style=\"font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--color-neutral-600);padding:6px 8px\">domain plugins — the agent stays the same<\u002Fdiv>\n          <sc-for list=\"{{ plugins }}\" as=\"p\" hint-placeholder-count=\"3\">\n            <button sc-camel-on-click=\"{{ p.pick }}\" style=\"display:block;width:100%;text-align:left;background:none;border:none;border-radius:var(--radius-md);padding:8px;font-family:var(--font-body);font-size:14px;color:var(--color-text);cursor:pointer\" style-hover=\"background:var(--color-neutral-200)\">\n              <span style=\"font-weight:600\">{{ p.name }}<\u002Fspan>\n              <span style=\"color:var(--color-neutral-600)\"> · {{ p.tools }}<\u002Fspan>\n              <div style=\"font-size:12.5px;color:var(--color-neutral-700)\">{{ p.blurb }}<\u002Fdiv>\n            <\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n\n      <button sc-camel-on-click=\"{{ toggleRight }}\" title=\"Plan &amp; memory\" style=\"margin-left:auto;align-self:center;display:flex;align-items:center;justify-content:center;width:34px;height:34px;background:none;border:none;padding:0;border-radius:999px;color:{{ rightIconColor }};cursor:pointer\" style-hover=\"background:var(--color-neutral-200)\">\n        <svg width=\"19\" height=\"19\" sc-camel-view-box=\"0 0 20 20\" fill=\"none\" aria-hidden=\"true\">\n          <rect x=\"2.5\" y=\"3.5\" width=\"15\" height=\"13\" rx=\"2.5\" stroke=\"currentColor\" stroke-width=\"1.4\"><\u002Frect>\n          <rect x=\"12.2\" y=\"4.2\" width=\"4.6\" height=\"11.6\" rx=\"1.8\" fill=\"currentColor\" fill-opacity=\"{{ rightFill }}\"><\u002Frect>\n          <line x1=\"12.2\" y1=\"3.5\" x2=\"12.2\" y2=\"16.5\" stroke=\"currentColor\" stroke-width=\"1.4\"><\u002Fline>\n        <\u002Fsvg>\n      <\u002Fbutton>\n  <\u002Fheader>\n\n  <div style=\"display:flex;align-items:stretch;flex:1;min-height:0;gap:var(--space-3);padding:0 var(--space-3) var(--space-3);flex-wrap:nowrap\">\n\n    <sc-if value=\"{{ leftOpen }}\" hint-placeholder-val=\"{{ true }}\">\n      <aside style=\"flex:0 1 232px;min-width:180px;background:rgba(255,255,255,.045);backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);box-shadow:inset 0 0 0 1px rgba(255,255,255,.07), 0 18px 44px rgba(0,0,0,.45);border-radius:18px;padding:var(--space-4);overflow-y:auto\">\n        <div style=\"font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--color-neutral-600);margin-bottom:var(--space-3)\">YOUR DOCUMENTS<\u002Fdiv>\n        <label style=\"display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:var(--space-3);padding:10px 8px;border:1px dashed var(--color-neutral-400);border-radius:var(--radius-md);font-size:13px;color:var(--color-neutral-700);cursor:pointer\" style-hover=\"border-color:var(--color-accent);color:var(--color-accent-700)\">\n          <span style=\"font-size:15px\">＋<\u002Fspan>\n          <span>{{ uploadLabel }}<\u002Fspan>\n          <input type=\"file\" multiple=\"\" sc-camel-on-change=\"{{ onUpload }}\" style=\"display:none\">\n        <\u002Flabel>\n        <div style=\"display:flex;flex-direction:column;gap:2px\">\n          <sc-for list=\"{{ docs }}\" as=\"d\" hint-placeholder-count=\"6\">\n            <button sc-camel-on-click=\"{{ d.pick }}\" style=\"display:flex;align-items:stretch;gap:10px;width:100%;text-align:left;background:none;border:none;border-radius:var(--radius-md);padding:7px 8px;margin-left:-8px;font-family:var(--font-body);font-size:14px;color:{{ d.color }};cursor:pointer\" style-hover=\"background:var(--color-neutral-200)\">\n              <span style=\"width:3px;flex:0 0 3px;border-radius:2px;background:{{ d.bar }}\"><\u002Fspan>\n              <span style=\"flex:1;line-height:1.3\">{{ d.name }}<\u002Fspan>\n            <\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Faside>\n    <\u002Fsc-if>\n\n    <main style=\"flex:1 1 420px;min-width:0;display:flex;flex-direction:column;align-items:center;gap:var(--space-6);padding:var(--space-2) var(--space-6) var(--space-8);overflow-y:auto\">\n      <div style=\"width:100%;max-width:72ch;display:flex;flex-direction:column;gap:var(--space-6)\">\n\n        <div>\n          <div style=\"font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--color-neutral-600);margin-bottom:var(--space-2)\">you asked<\u002Fdiv>\n          <p style=\"margin:0;font-family:var(--font-heading);font-weight:600;font-size:23px;line-height:1.32;text-wrap:pretty\">I've been flat on squats for three weeks and my sleep is trash. What should the next block look like?<\u002Fp>\n        <\u002Fdiv>\n\n        <div>\n          <div style=\"display:flex;align-items:baseline;gap:var(--space-2);margin-bottom:var(--space-3)\">\n\n\n          <\u002Fdiv>\n\n          <p style=\"margin:0 0 var(--space-4)\">Your squat isn't stalling from programming volume — it's stalling from recovery. Mean sleep over the last 21 days is 5h 48m against your 7h 15m baseline<button sc-camel-on-click=\"{{ openSleep }}\" style=\"background:none;border:none;padding:0 1px;font-family:var(--font-body);font-size:11.5px;vertical-align:super;color:var(--color-accent-700);cursor:pointer;border-bottom:1px solid var(--color-accent-300)\" style-hover=\"background:var(--color-accent-100)\">1<\u002Fbutton>, and every one of the three missed top sets landed on a day following under six hours<button sc-camel-on-click=\"{{ openLog }}\" style=\"background:none;border:none;padding:0 1px;font-family:var(--font-body);font-size:11.5px;vertical-align:super;color:var(--color-accent-700);cursor:pointer;border-bottom:1px solid var(--color-accent-300)\" style-hover=\"background:var(--color-accent-100)\">2<\u002Fbutton>. Your March ferritin came back at 31 ng/mL, low-normal and consistent with the flatness you're describing<button sc-camel-on-click=\"{{ openBlood }}\" style=\"background:none;border:none;padding:0 1px;font-family:var(--font-body);font-size:11.5px;vertical-align:super;color:var(--color-accent-700);cursor:pointer;border-bottom:1px solid var(--color-accent-300)\" style-hover=\"background:var(--color-accent-100)\">3<\u002Fbutton>.<\u002Fp>\n\n          <p style=\"margin:0 0 var(--space-4)\">So the next four weeks hold intensity and cut density. Four sessions, as you prefer, with the heavy squat moved off Monday.<\u002Fp>\n\n          <sc-raw-table class=\"table\" style=\"width:100%;font-size:14px\">\n            <sc-raw-thead>\n              <sc-raw-tr>\n                <sc-raw-th>Week<\u002Fsc-raw-th>\n                <sc-raw-th>Squat<\u002Fsc-raw-th>\n                <sc-raw-th>Volume<\u002Fsc-raw-th>\n                <sc-raw-th>Intent<\u002Fsc-raw-th>\n              <\u002Fsc-raw-tr>\n            <\u002Fsc-raw-thead>\n            <sc-raw-tbody>\n              <sc-raw-tr><sc-raw-td>1<\u002Fsc-raw-td><sc-raw-td>4 × 4 @ 82%<\u002Fsc-raw-td><sc-raw-td>−20%<\u002Fsc-raw-td><sc-raw-td>Reset, no misses<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n              <sc-raw-tr><sc-raw-td>2<\u002Fsc-raw-td><sc-raw-td>4 × 3 @ 85%<\u002Fsc-raw-td><sc-raw-td>−15%<\u002Fsc-raw-td><sc-raw-td>Speed off the floor<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n              <sc-raw-tr><sc-raw-td>3<\u002Fsc-raw-td><sc-raw-td>3 × 2 @ 89%<\u002Fsc-raw-td><sc-raw-td>−15%<\u002Fsc-raw-td><sc-raw-td>Heavy, low fatigue<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n              <sc-raw-tr><sc-raw-td>4<\u002Fsc-raw-td><sc-raw-td>Single @ 92%<\u002Fsc-raw-td><sc-raw-td>−40%<\u002Fsc-raw-td><sc-raw-td>Test, then deload<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <\u002Fsc-raw-tbody>\n          <\u002Fsc-raw-table>\n\n          <p style=\"margin:var(--space-4) 0 0;font-size:14px;color:var(--color-neutral-700)\">Retest in four weeks. If sleep is still under six hours by week two, I'll hold week 3 rather than progress it — flag me and I'll rewrite.<\u002Fp>\n        <\u002Fdiv>\n\n        <div style=\"display:flex;align-items:center;gap:var(--space-2);background:rgba(255,255,255,.05);backdrop-filter:blur(14px);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);border-radius:999px;padding:8px 8px 8px var(--space-3)\">\n          <span style=\"color:var(--color-neutral-500);font-size:16px\">›<\u002Fspan>\n          <input class=\"input\" placeholder=\"Ask in your own words…\" style=\"flex:1;border:none;box-shadow:none;background:none;padding:0;font-size:15px\">\n          <button class=\"btn btn-primary\" style=\"font-size:13.5px;padding:7px 18px;border-radius:999px\">Ask<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fmain>\n\n    <sc-if value=\"{{ rightOpen }}\" hint-placeholder-val=\"{{ true }}\">\n    <aside style=\"flex:0 1 360px;min-width:268px;background:rgba(255,255,255,.045);backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);box-shadow:inset 0 0 0 1px rgba(255,255,255,.07), 0 18px 44px rgba(0,0,0,.45);border-radius:18px;padding:var(--space-4);overflow-y:auto\">\n        <div style=\"display:flex;gap:6px;margin-bottom:var(--space-4)\">\n          <button sc-camel-on-click=\"{{ showPlan }}\" style=\"flex:1 1 auto;min-width:0;background:{{ planPillBg }};box-shadow:{{ planPillBgRing }};border:none;border-radius:999px;padding:8px 4px;font-family:var(--font-body);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:{{ planTabColor }};cursor:pointer\" style-hover=\"background:rgba(255,255,255,.09)\">plan<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ showSourceTab }}\" style=\"flex:1 1 auto;min-width:0;background:{{ srcPillBg }};box-shadow:{{ srcPillBgRing }};border:none;border-radius:999px;padding:8px 4px;font-family:var(--font-body);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:{{ srcTabColor }};cursor:pointer\" style-hover=\"background:rgba(255,255,255,.09)\">source<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ showMemoryTab }}\" style=\"flex:1 1 auto;min-width:0;background:{{ memPillBg }};box-shadow:{{ memPillBgRing }};border:none;border-radius:999px;padding:8px 4px;font-family:var(--font-body);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:{{ memTabColor }};cursor:pointer\" style-hover=\"background:rgba(255,255,255,.09)\">sessions<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ showSavedTab }}\" style=\"flex:1 1 auto;min-width:0;background:{{ savedPillBg }};box-shadow:{{ savedPillBgRing }};border:none;border-radius:999px;padding:8px 4px;font-family:var(--font-body);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:{{ savedTabColor }};cursor:pointer\" style-hover=\"background:rgba(255,255,255,.09)\">memory<\u002Fbutton>\n        <\u002Fdiv>\n\n      <sc-if value=\"{{ tabPlan }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"display:flex;flex-direction:column;gap:var(--space-3)\">\n          <sc-for list=\"{{ steps }}\" as=\"s\" hint-placeholder-count=\"5\">\n            <div>\n              <button sc-camel-on-click=\"{{ s.toggle }}\" style=\"display:flex;align-items:baseline;gap:var(--space-2);width:100%;text-align:left;background:none;border:none;padding:4px 8px 4px 0;font-family:var(--font-body);font-size:14px;color:var(--color-text);cursor:pointer\" style-hover=\"color:var(--color-accent-700)\">\n                <span style=\"font-size:12px;color:var(--color-neutral-500);min-width:1.4em\">{{ s.n }}<\u002Fspan>\n                <span style=\"flex:1;line-height:1.35\">{{ s.label }}<\u002Fspan>\n                <span style=\"font-size:12px;color:{{ s.markColor }}\">{{ s.mark }}<\u002Fspan>\n              <\u002Fbutton>\n              <sc-if value=\"{{ s.open }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"margin:2px 0 var(--space-2) calc(1.4em + var(--space-2));padding:var(--space-2) var(--space-3);background:rgba(0,0,0,.28);border-radius:10px\">\n                  <div style=\"font-size:13px;color:var(--color-accent-900);word-break:break-word\">{{ s.call }}<\u002Fdiv>\n                  <div style=\"font-size:12.5px;color:var(--color-neutral-700);margin-top:4px\">{{ s.result }}<\u002Fdiv>\n                  <div style=\"font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--color-neutral-600);margin-top:6px\">{{ s.origin }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n          <div style=\"font-size:12.5px;color:var(--color-neutral-700);margin-top:var(--space-2);max-width:38ch\">cora chose these steps. Nothing here is a fixed pipeline — the tools come from the loaded plugin.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ tabSource }}\" hint-placeholder-val=\"{{ false }}\">\n        <div>\n          <div style=\"font-family:var(--font-heading);font-weight:600;font-size:17px\">{{ src.title }}<\u002Fdiv>\n          <div style=\"font-size:12.5px;color:var(--color-neutral-600);margin-bottom:var(--space-3)\">{{ src.meta }}<\u002Fdiv>\n          <div style=\"font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--color-accent-700);margin-bottom:var(--space-2)\">{{ citedCount }}<\u002Fdiv>\n          <div style=\"background:rgba(0,0,0,.28);box-shadow:inset 0 0 0 1px rgba(255,255,255,.06);border-radius:12px;padding:var(--space-4);font-size:14px;line-height:1.6\">\n            <sc-for list=\"{{ blocks }}\" as=\"b\" hint-placeholder-count=\"6\">\n              <div style=\"background:{{ b.bg }};box-shadow:{{ b.edge }};padding:{{ b.pad }};margin:{{ b.mar }};color:{{ b.color }}\">{{ b.text }}<\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"font-size:12.5px;color:var(--color-neutral-700);margin-top:var(--space-3)\">{{ src.note }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ tabMemory }}\" hint-placeholder-val=\"{{ false }}\">\n        <div>\n          <div style=\"font-size:14px;color:var(--color-neutral-700);margin-bottom:var(--space-3);max-width:38ch\">What cora carries between sessions. Editable — remove a line and it stops assuming it.<\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:2px\">\n            <sc-for list=\"{{ memories }}\" as=\"m\" hint-placeholder-count=\"5\">\n              <div style=\"display:flex;align-items:baseline;gap:var(--space-2);padding:7px 8px;margin-left:-8px;border-radius:var(--radius-md)\" style-hover=\"background:var(--color-neutral-200)\">\n                <span style=\"flex:1;font-size:14px;line-height:1.35\">{{ m.text }}<\u002Fspan>\n                \n                <button sc-camel-on-click=\"{{ m.forget }}\" style=\"background:none;border:none;padding:0;font-family:var(--font-body);font-size:12.5px;color:var(--color-accent-2);cursor:pointer\" style-hover=\"opacity:.7\">forget<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ tabSaved }}\" hint-placeholder-val=\"{{ false }}\">\n        <div>\n          <div style=\"font-size:14px;color:var(--color-neutral-700);margin-bottom:var(--space-4);max-width:40ch\">Only what you told cora to save. It never writes here on its own — say <span style=\"font-style:italic\">remember that<\u002Fspan> and the line appears.<\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:var(--space-2)\">\n            <sc-for list=\"{{ saved }}\" as=\"k\" hint-placeholder-count=\"4\">\n              <div style=\"padding:var(--space-3);background:rgba(0,0,0,.28);border-radius:12px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)\">\n                <div style=\"display:flex;align-items:center;gap:var(--space-2)\">\n                  <span style=\"flex:1;font-size:14px;line-height:1.4\">{{ k.text }}<\u002Fspan>\n                  <button sc-camel-on-click=\"{{ k.forget }}\" style=\"background:none;border:none;padding:0;font-family:var(--font-body);font-size:12.5px;color:var(--color-accent-2);cursor:pointer\" style-hover=\"opacity:.7\">delete<\u002Fbutton>\n                <\u002Fdiv>\n                \n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          \n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Faside>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n\n  <sc-if value=\"{{ popupOpen }}\" hint-placeholder-val=\"{{ false }}\">\n    <div sc-camel-on-click=\"{{ closePopup }}\" style=\"position:fixed;inset:0;z-index:60;background:rgba(4,6,10,.62);display:flex;align-items:center;justify-content:center;padding:var(--space-6)\">\n      <div sc-camel-on-click=\"{{ stop }}\" style=\"width:min(560px,100%);max-height:80vh;overflow:auto;background:rgba(20,25,33,.9);backdrop-filter:blur(24px) saturate(150%);box-shadow:inset 0 0 0 1px rgba(255,255,255,.1), var(--shadow-lg);border-radius:20px;padding:var(--space-6)\">\n        <div style=\"display:flex;align-items:baseline;gap:var(--space-3)\">\n          <div style=\"flex:1\">\n            <div style=\"font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--color-neutral-600)\">cited source<\u002Fdiv>\n            <div style=\"font-family:var(--font-heading);font-weight:600;font-size:19px;line-height:1.25;margin-top:2px\">{{ src.title }}<\u002Fdiv>\n            <div style=\"font-size:12.5px;color:var(--color-neutral-600);margin-top:2px\">{{ src.meta }}<\u002Fdiv>\n          <\u002Fdiv>\n          <button sc-camel-on-click=\"{{ closePopup }}\" style=\"background:none;border:none;padding:2px 6px;font-family:var(--font-body);font-size:16px;color:var(--color-neutral-600);cursor:pointer\" style-hover=\"color:var(--color-text)\">✕<\u002Fbutton>\n        <\u002Fdiv>\n\n        <div style=\"margin-top:var(--space-4);font-size:14.5px;line-height:1.65\">\n          <sc-for list=\"{{ blocks }}\" as=\"b\" hint-placeholder-count=\"6\">\n            <div style=\"background:{{ b.bg }};box-shadow:{{ b.edge }};padding:{{ b.pad }};margin:{{ b.mar }};color:{{ b.color }}\">{{ b.text }}<\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <div style=\"margin-top:var(--space-6);font-size:12.5px;color:var(--color-neutral-700)\">{{ src.note }}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;showDocsRail&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Layout&quot;},&quot;pluginLabel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;fitness-coach v0.4&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Plugin&quot;},&quot;accentColor&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#2f81f7&quot;,&quot;options&quot;:[&quot;#2f81f7&quot;,&quot;#58a6ff&quot;,&quot;#e05a9c&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Layout&quot;}}\">\nconst DOCS_FULL = {\n  sleep: [\n    \"WHOOP export — sleep & recovery, 2026-07-28 → 2026-08-17. Units: hours:minutes. Baseline computed over trailing 90 days.\",\n    \"Week of 07-28 — mean 6h 22m · 3 nights under 6h · HRV 61ms · RHR 54bpm.\",\n    \"Week of 08-04 — mean 5h 31m · 5 nights under 6h · HRV 52ms · RHR 58bpm. Two late flights logged.\",\n    { cited: true, text: \"Week of 08-11 — mean 5h 30m · 3 nights under 6h · HRV 54ms · RHR 57bpm.\" },\n    { cited: true, text: \"Mean sleep duration 5h 48m (baseline 7h 15m). 11 of 21 nights under 6h. Mean respiratory rate stable; HRV −14% vs. 90-day mean.\" },\n    \"Sleep debt accumulating from 2026-07-31 onward. No recovery scores above 70% after 08-03.\",\n    \"Nap data excluded. Two nights (08-09, 08-16) flagged low-confidence — strap disconnected.\"\n  ],\n  log: [\n    \"Training log (Notion export).csv — 1,204 rows, columns: date, block, session, lift, prescription, result, note.\",\n    \"2026-07-28 back squat 4×5 @ 140kg — all sets complete. Note: \\\"felt easy.\\\"\",\n    \"2026-07-31 front squat 3×6 @ 105kg — complete. RDL 3×8 @ 130kg.\",\n    { cited: true, text: \"2026-08-04 back squat 4×5 @ 145kg — set 4 failed at rep 3. Note: \\\"legs felt hollow, 5h sleep.\\\" Same pattern 08-11 and 08-15.\" },\n    \"2026-08-08 bench 5×5 @ 100kg — complete. Upper body sessions unaffected across the block.\",\n    \"2026-08-11 back squat 4×5 @ 145kg — set 4 failed at rep 4. Note: \\\"same as last week.\\\"\",\n    { cited: true, text: \"2026-08-15 back squat 4×5 @ 145kg — set 3 failed at rep 5, set 4 skipped.\" },\n    \"Front squat and RDL loads unchanged across the block. Session attendance 12 of 12.\"\n  ],\n  blood: [\n    \"Bloodwork_2026-03.pdf — page 2 of 4. Collected 2026-03-09, fasting. Reference ranges per lab.\",\n    \"Complete blood count within reference range. Hemoglobin 14.6 g/dL. Hematocrit 43%. MCV 89 fL.\",\n    { cited: true, text: \"Ferritin 31 ng/mL (ref. 24–336). Vitamin D 28 ng/mL (ref. 30–100). Note from ordering physician: recheck in six months.\" },\n    \"TSH 1.9 mIU/L. Free T4 1.2 ng/dL. No further flags.\",\n    \"Lipids: total 178 mg/dL, HDL 58, LDL 102, triglycerides 89.\",\n    \"Comment: \\\"Iron stores at the low end for an athlete in a heavy training block. Dietary review advised before supplementation.\\\"\"\n  ],\n  intake: [\n    \"Intake form.pdf — page 1 of 3. Completed 2026-03-12.\",\n    \"Training age: 7 years. Current bodyweight 84kg. Equipment: full commercial gym.\",\n    { cited: true, text: \"\\\"Four sessions a week, max. 180kg squat by December. Left knee tracks in under load — cue it. I will not do burpees.\\\"\" },\n    \"Prior injuries: left meniscus, 2022, non-surgical. Cleared for loaded squatting by physio, Nov 2022.\",\n    \"Sleep, self-reported: \\\"6–7 hours, worse when travelling.\\\"\",\n    \"Preferred contact: async. \\\"Send the plan, don't call me.\\\"\"\n  ]\n};\n\nObject.assign(DOCS_FULL, {\n  notes: [\n    \"Coach notes — Feb.md\",\n    \"Feb 3 — moved heavy squat to Tuesday for two weeks; complained about Monday sessions after travel.\",\n    \"Feb 11 — knee cue landing well: “knees over mid-foot, spread the floor.” Keep using it.\",\n    \"Feb 19 — asked for fewer accessories. Cut arms to one slot.\",\n    \"Feb 27 — mood good, loads climbing. No recovery complaints this month.\"\n  ],\n  physio: [\n    \"Physio discharge letter.pdf — 2022-11-14.\",\n    \"Left meniscus, posterior horn, managed non-surgically. Full range of motion restored.\",\n    \"Cleared for loaded bilateral squatting without depth restriction. Advise single-leg work twice weekly.\",\n    \"No follow-up scheduled. Return if joint line pain recurs under load.\"\n  ]\n});\n\nconst SOURCES = {\n  sleep: {\n    title: \"Whoop export — sleep, 21 days\",\n    meta: \"wearable.sleep() · pulled 4 min ago · plugin tool\",\n    before: \"…rolling averages, 2026-07-28 → 2026-08-17.\",\n    passage: \"Mean sleep duration 5h 48m (baseline 7h 15m). 11 of 21 nights under 6h. Mean respiratory rate stable; HRV −14% vs. 90-day mean.\",\n    after: \"Sleep debt accumulating from 2026-07-31 onward.\",\n    note: \"Returned by the fitness plugin, not stored by cora. The plan cites the numbers it actually read.\"\n  },\n  log: {\n    title: \"Training log (Notion export).csv\",\n    meta: \"1,204 rows · last edited yesterday · your document\",\n    before: \"…week 31, session 2 — lower.\",\n    passage: \"2026-08-04 back squat 4×5 @ 145kg — set 4 failed at rep 3. Note: \\\"legs felt hollow, 5h sleep.\\\" Same pattern 08-11 and 08-15.\",\n    after: \"Front squat and RDL loads unchanged across the block.\",\n    note: \"Passage located by search, not by keyword match — cora read the surrounding rows to confirm the pattern.\"\n  },\n  notes: {\n    title: \"Coach notes — Feb.md\",\n    meta: \"4 entries · your document\",\n    note: \"Read during indexing, not used in this answer — nothing here bore on the stall.\"\n  },\n  physio: {\n    title: \"Physio discharge letter.pdf\",\n    meta: \"1 page · your document\",\n    note: \"Available to cora, not cited here. It informs the knee cue, not the block.\"\n  },\n  blood: {\n    title: \"Bloodwork_2026-03.pdf\",\n    meta: \"page 2 of 4 · your document\",\n    before: \"…complete blood count within reference range.\",\n    passage: \"Ferritin 31 ng/mL (ref. 24–336). Vitamin D 28 ng/mL (ref. 30–100). Note from ordering physician: recheck in six months.\",\n    after: \"TSH 1.9 mIU/L. No further flags.\",\n    note: \"cora will not interpret this medically — it flags the value and cites the page.\"\n  },\n  intake: {\n    title: \"Intake form.pdf\",\n    meta: \"page 1 of 3 · your document\",\n    before: \"…goals, in the client's words.\",\n    passage: \"\\\"Four sessions a week, max. 180kg squat by December. Left knee tracks in under load — cue it. I will not do burpees.\\\"\",\n    after: \"Prior injuries: left meniscus, 2022, non-surgical.\",\n    note: \"This is where the plan's four-session constraint comes from.\"\n  }\n};\n\nclass Component extends DCLogic {\n  state = {\n    tab: \"plan\",\n    src: \"sleep\",\n    menuOpen: false,\n    plugin: null,\n    open: { 3: true },\n    forgotten: {}\n  };\n\n  pick(key) { this.setState({ tab: \"source\", src: key, popup: false, rightOpen: true }); }\n  cite(key) { this.setState({ src: key, popup: true }); }\n  toggle(n) { this.setState(s => ({ open: { ...s.open, [n]: !s.open[n] } })); }\n\n  renderVals() {\n    const accent = this.props.accentColor ?? \"var(--color-accent)\";\n    const tint = \"background:var(--color-neutral-200)\";\n    const plugin = this.state.plugin ?? this.props.pluginLabel ?? \"fitness-coach v0.4\";\n    const on = \"var(--color-text)\", off = \"var(--color-neutral-600)\";\n    const t = this.state.tab;\n\n    const steps = [\n      { n: \"1\", label: \"Read the client's goals and constraints\", call: \"docs.search(\\\"goals, sessions per week, constraints\\\")\", result: \"Intake form.pdf → 4 sessions/wk max, 180kg by December, knee cue\", origin: \"core retrieval\", mark: \"✓\" },\n      { n: \"2\", label: \"Pull the last 21 days of sessions\", call: \"training_log.query(range: \\\"21d\\\", lift: \\\"back squat\\\")\", result: \"3 missed top sets: 08-04, 08-11, 08-15\", origin: \"plugin tool · fitness-coach\", mark: \"✓\" },\n      { n: \"3\", label: \"Check recovery markers against baseline\", call: \"wearable.sleep(range: \\\"21d\\\", compare: \\\"baseline\\\")\", result: \"Mean 5h48m vs 7h15m baseline; HRV −14%\", origin: \"plugin tool · fitness-coach\", mark: \"✓\" },\n      { n: \"4\", label: \"Cross-check labs before blaming programming\", call: \"docs.search(\\\"ferritin, vitamin D, hemoglobin\\\")\", result: \"Bloodwork_2026-03.pdf p.2 → ferritin 31 ng/mL\", origin: \"core retrieval\", mark: \"✓\" },\n      { n: \"5\", label: \"Draft a four-week block that holds intensity\", call: \"periodize(model: \\\"undulating\\\", weeks: 4, sessions: 4)\", result: \"Volume −20% wk1, retest wk4\", origin: \"plugin tool · fitness-coach\", mark: \"✓\" }\n    ].map(s => ({\n      ...s,\n      open: !!this.state.open[Number(s.n)],\n      markColor: accent,\n      toggle: () => this.toggle(Number(s.n))\n    }));\n\n    const memories = [\n      { text: \"Four sessions a week — never proposes five\", when: \"session 1\" },\n      { text: \"Left knee tracks in under load; cue it every squat block\", when: \"session 1\" },\n      { text: \"Won't do burpees. Stop offering conditioning circuits\", when: \"session 3\" },\n      { text: \"Prefers plans as tables, reasoning underneath\", when: \"session 6\" },\n      { text: \"Ferritin low-normal since March — recheck due September\", when: \"session 11\" }\n    ].filter(m => !this.state.forgotten[m.text])\n     .map(m => ({ ...m, forget: () => this.setState(s => ({ forgotten: { ...s.forgotten, [m.text]: true } })) }));\n\n    const docs = [\n      { name: \"Intake form.pdf\", key: \"intake\", cited: true },\n      { name: \"Bloodwork_2026-03.pdf\", key: \"blood\", cited: true },\n      { name: \"Training log (Notion export)\", key: \"log\", cited: true },\n      { name: \"Whoop export — sleep\", key: \"sleep\", cited: true },\n      { name: \"Coach notes — Feb.md\", key: \"notes\", cited: false },\n      { name: \"Physio discharge letter.pdf\", key: \"physio\", cited: false }\n    ].concat(this.state.uploads || []).map(d => ({\n      ...d,\n      bar: d.cited ? accent : \"transparent\",\n      color: d.cited ? \"var(--color-text)\" : \"var(--color-neutral-600)\",\n      pick: () => this.pick(d.key)\n    }));\n\n    const plugins = [\n      { name: \"fitness-coach v0.4\", tools: \"6 tools\", blurb: \"training_log, wearable, periodize, nutrition…\" },\n      { name: \"clinic-intake v0.2\", tools: \"4 tools\", blurb: \"ehr_lookup, triage, referral, scheduling\" },\n      { name: \"legal-discovery v0.1\", tools: \"5 tools\", blurb: \"docket, precedent, redact, privilege_log\" }\n    ].map(p => ({ ...p, pick: () => this.setState({ plugin: p.name, menuOpen: false }) }));\n\n    const saved = [\n      { text: \"Four sessions a week, max. Never propose five.\", stamp: \"saved by you · 12 Mar · session 1\" },\n      { text: \"No burpees, no conditioning circuits. Ever.\", stamp: \"saved by you · 2 Apr · session 3\" },\n      { text: \"Give me the plan as a table first, reasoning underneath.\", stamp: \"saved by you · 19 May · session 6\" },\n      { text: \"Recheck ferritin in September — remind me.\", stamp: \"saved by you · 4 Aug · session 11\" }\n    ].filter(k => !this.state.forgotten[k.text])\n     .map(k => ({ ...k, forget: () => this.setState(s => ({ forgotten: { ...s.forgotten, [k.text]: true } })) }));\n\n    const blocks = (DOCS_FULL[this.state.src] || []).map((b, i) => {\n      const cited = typeof b === \"object\";\n      return {\n        i,\n        text: cited ? b.text : b,\n        bg: cited ? \"var(--color-accent-100)\" : \"transparent\",\n        edge: cited ? \"-3px 0 0 \" + accent : \"none\",\n        color: cited ? \"var(--color-text)\" : \"var(--color-neutral-600)\",\n        pad: cited ? \"8px 12px\" : \"0\",\n        mar: cited ? \"12px -12px\" : \"0 0 10px\"\n      };\n    });\n\n    const nCited = blocks.filter(b => b.bg !== \"transparent\").length;\n\n    const leftOpen = this.state.leftOpen ?? (this.props.showDocsRail ?? true);\n    const rightOpen = this.state.rightOpen ?? true;\n\n    return {\n      leftOpen, rightOpen,\n      leftIconColor: leftOpen ? accent : \"var(--color-neutral-600)\",\n      accent,\n      savedCount: saved.length,\n      planPillBg: t === \"plan\" ? accent : \"rgba(255,255,255,.05)\",\n      srcPillBg: t === \"source\" ? accent : \"rgba(255,255,255,.05)\",\n      memPillBg: t === \"memory\" ? accent : \"rgba(255,255,255,.05)\",\n      savedPillBg: t === \"saved\" ? accent : \"rgba(255,255,255,.05)\",\n      planPillBgRing: t === \"plan\" ? \"none\" : \"inset 0 0 0 1px rgba(255,255,255,.08)\",\n      srcPillBgRing: t === \"source\" ? \"none\" : \"inset 0 0 0 1px rgba(255,255,255,.08)\",\n      memPillBgRing: t === \"memory\" ? \"none\" : \"inset 0 0 0 1px rgba(255,255,255,.08)\",\n      savedPillBgRing: t === \"saved\" ? \"none\" : \"inset 0 0 0 1px rgba(255,255,255,.08)\",\n      leftFill: leftOpen ? 1 : 0,\n      rightFill: rightOpen ? 1 : 0,\n      rightIconColor: rightOpen ? accent : \"var(--color-neutral-600)\",\n      toggleLeft: () => this.setState({ leftOpen: !leftOpen }),\n      toggleRight: () => this.setState({ rightOpen: !rightOpen }),\n      blocks,\n      uploadLabel: \"Add a document\",\n      onUpload: (e) => {\n        const files = Array.from(e.target.files || []);\n        if (!files.length) return;\n        const added = files.map(f => ({ name: f.name, key: \"upload:\" + f.name, cited: false }));\n        added.forEach(a => {\n          DOCS_FULL[a.key] = [\"Indexing \" + a.name + \" …\", \"cora reads the file locally, then makes it available to the plan. Ask a question and it decides whether this document belongs in the answer.\"];\n          SOURCES[a.key] = { title: a.name, meta: \"just added · indexing\", note: \"Newly added, not yet cited.\" };\n        });\n        this.setState(s => ({ uploads: [...(s.uploads || []), ...added] }));\n        e.target.value = \"\";\n      },\n      citedCount: nCited === 0 ? \"not cited in this answer\" : nCited + (nCited === 1 ? \" cited passage\" : \" cited passages\") + \" · highlighted\",\n      saved,\n      tabSaved: t === \"saved\",\n      savedTabColor: t === \"saved\" ? \"#fff\" : off,\n      savedTabRule: t === \"saved\" ? accent : \"transparent\",\n      showSavedTab: () => this.setState({ tab: \"saved\" }),\n      pluginLabel: plugin,\n      showDocsRail: this.props.showDocsRail ?? true,\n      menuOpen: this.state.menuOpen,\n      togglePlugins: () => this.setState(s => ({ menuOpen: !s.menuOpen })),\n      plugins, docs, steps, memories,\n      src: SOURCES[this.state.src],\n      tabPlan: t === \"plan\", tabSource: t === \"source\", tabMemory: t === \"memory\",\n      planTabColor: t === \"plan\" ? \"#fff\" : off,\n      srcTabColor: t === \"source\" ? \"#fff\" : off,\n      memTabColor: t === \"memory\" ? \"#fff\" : off,\n      planTabRule: t === \"plan\" ? accent : \"transparent\",\n      srcTabRule: t === \"source\" ? accent : \"transparent\",\n      memTabRule: t === \"memory\" ? accent : \"transparent\",\n      showPlan: () => this.setState({ tab: \"plan\" }),\n      showSourceTab: () => this.setState({ tab: \"source\" }),\n      showMemoryTab: () => this.setState({ tab: \"memory\" }),\n      openMemory: () => this.setState({ tab: \"saved\", rightOpen: true }),\n      openSleep: () => this.cite(\"sleep\"),\n      openLog: () => this.cite(\"log\"),\n      openBlood: () => this.cite(\"blood\"),\n      popupOpen: !!this.state.popup,\n      closePopup: () => this.setState({ popup: false }),\n      stop: (e) => e.stopPropagation(),\n      openInRail: () => this.setState({ popup: false, tab: \"source\" }),\n      pluginBtnHover: \"background:var(--color-accent-200)\",\n      menuItemHover: tint,\n      stepHover: \"color:var(--color-accent-700)\",\n      citeHover: \"color:var(--color-accent-600);background:var(--color-accent-100)\",\n      linkHover: \"opacity:.7\"\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>

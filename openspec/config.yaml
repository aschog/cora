schema: spec-driven

context: |
  What cora is, `README.md` says. What it is made of, `docs/big-picture.md` and
  `docs/happy-path.md` say. The house rules — uv for every command, secrets in the
  environment, plain Conventional Commits — are `CLAUDE.md`, and the process is
  `docs/workflow.md`, which is authoritative. Open them; this file repeats none of it.

  What it does say, because nothing else does: a turn runs on LangGraph, but the domain
  holds the state shape and the engine holds the steps as plain functions — neither
  imports LangGraph, an adapter wires them into a graph, and an architecture guard
  enforces that. OpenSpec artifacts serve the workflow: a change is one story, and its
  `tasks.md` is a Beck test list.

rules:
  proposal:
    - >-
      Three sections and nothing else: **Why** — the problem, in a paragraph; **What
      Changes** — what will be different, including the capabilities it adds or modifies;
      **Impact** — the code, docs, dependencies and guards it touches, and what it leaves
      alone.
    - >-
      The story and its acceptance criteria are not here. They live once, in the delta
      spec. Neither is the design rationale, which lives in design.md, the conversation,
      the commit messages and the tests.
    - >-
      One story per change. If it needs two stories, it is two changes.
  specs:
    - >-
      The delta spec is where the story lives. Head it with the story in the standard
      three lines — "As a <role>," / "I want <capability>," / "so that <benefit>." — each
      on its own line, ended with a backslash, above the Purpose.
    - >-
      Its requirements are the acceptance criteria, in the product's voice rather than
      the sprint's. Material the story produces — text to be written, a list to be shown
      — belongs in the requirement that asks for it, so the change carries it once.
    - >-
      Write requirements as SHALL statements with concrete scenarios, observable from
      outside the system through its public API.
    - >-
      A capability path names a behaviour of the product, not a module of the code.
    - >-
      A change whose subject is a written page has no delta spec: set `skip_specs: true`
      in its `.openspec.yaml` and leave the story in the sprint's spec.md. A delta says
      what the product does, and a page's wording is not that.
    - >-
      Main specs grow one archive at a time. Write a delta only for what this change
      touches, and never back-fill a spec for code the change leaves alone — a
      capability with no spec yet is the tool working, not a gap to close.
  design:
    - >-
      Architecture level only — patterns, components, ports, flows, and the trade-off
      taken. No code, no signatures, no file-by-file plans.
    - >-
      Name the seam the change goes through. cora's north star is one abstraction open
      for extension: add a class or a registry entry, never edit a switch.
    - >-
      Dense bullets, not essays. Roughly 85 lines is the ceiling.
    - >-
      Say which ports, guards or generated diagrams the change touches.
  tasks:
    - >-
      **Every item is one failing test.** This overrides the default guidance — an item
      is not a session of work, it is a test. If it cannot be phrased as "write a test
      that shows X", it does not belong on the list: split it or drop it.
    - >-
      Item 1.1 is always the outer functional test, taken straight from the proposal's
      acceptance criterion and marked `@pytest.mark.xfail(strict=True)` so CI stays
      green while the change is in flight.
    - >-
      The last item is always dropping that marker and watching the outer test pass.
    - >-
      Tests drive behaviour through the public API with real objects and hand-written
      fakes, and assert on resulting state — not on how collaborators were called.
      Stubs are for true boundaries only: network, models, nondeterminism.
    - >-
      The list is living. Items get added as they surface, and a discovered item is not
      a failure of the plan.
    - >-
      Refactoring, docs and generated artifacts are not items unless a test can fail for
      them. Guards count: a guard is a test.

operations:
  apply:
    guidance:
      - >-
        Work one item at a time and stop. Red — write the test and see it fail for the
        right reason. Green — the minimal code that passes, whole suite green. Refactor
        — clean code and tests, stay green. Then hand back.
      - >-
        A failing test is never the thing that gets fixed. Do not edit, weaken or delete
        a red test to make the bar go green: the test is the spec, the production code
        is what moves.
      - >-
        Never commit. Propose the Conventional Commit subject and wait for approval.
        Commits on a branch are one line, with no body.
      - >-
        Never work on main. A change is applied on its own branch.
      - >-
        Don't narrate the diff — it gets read. Say only what the diff cannot show: a
        decision, a surprise, anything urgent.
      - >-
        If an item reveals the design is wrong, stop and re-plan rather than improvising
        off-list.
  archive:
    guidance:
      - >-
        Archive only once the outer functional test passes with its xfail marker gone,
        the whole list is ticked, and format, lint, type check and the full suite are
        green.
      - >-
        The change merges to main as one squashed atomic commit, and the branch is kept
        as the record of the TDD trail.
      - >-
        Update the project docs the change touched before archiving — `README.md`,
        `CLAUDE.md`, `docs/`.
